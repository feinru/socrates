services:
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: socrates-sparql
    environment:
      DBA_PASSWORD: dba
      SPARQL_UPDATE: 'true'
    ports:
      - '8890:8890' # SPARQL Endpoint HTTP / Conductor Web UI
      - '1111:1111' # ISQL connection port
    volumes:
      - ./sparql/db:/database
      - ./sparql/data:/opt/virtuoso-opensource/vsp/toload
    restart: unless-stopped

  pipeline:
    build: .
    container_name: socrates-pipeline
    environment:
      - VIRTUOSO_HOST=virtuoso
      - VIRTUOSO_CONTAINER=socrates-sparql
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    depends_on:
      - virtuoso

  retriever:
    build: .
    container_name: socrates-retriever
    command: python -m modules.vector.service
    ports:
      - '8000:8000'
    environment:
      - SPARQL_ENDPOINT=http://virtuoso:8890/sparql
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./modules/vector/db:/app/modules/vector/db
      - .:/app
      # Keep the 79 MB embedding model across container re-creation (re-download takes minutes).
      - chroma_models:/root/.cache/chroma
    depends_on:
      - virtuoso
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: socrates-web
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - SPARQL_ENDPOINT=http://retriever:8000/sparql
      - VECTOR_ENDPOINT=http://retriever:8000/hybrid
    depends_on:
      - virtuoso
      - retriever

volumes:
  chroma_models:
